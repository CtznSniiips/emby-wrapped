services:
  emby-wrapped:
    image: ghcr.io/ctznsniiips/emby-wrapped-ftp:latest
    container_name: emby-wrapped
    ports:
      - "8056:3003"
    environment:
      - NODE_ENV=production
      - EMBY_URL=${EMBY_URL}
      - EMBY_API_KEY=${EMBY_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - CACHE_TTL=${CACHE_TTL:-86400}
      - ANALYTICS_SCRIPT=${ANALYTICS_SCRIPT:-}
      - FILTER_USER_ID=${FILTER_USER_ID:-}
      - SEERR_URL=${SEERR_URL:-}
      - SEERR_API_KEY=${SEERR_API_KEY:-}
      - TRACEARR_URL=${TRACEARR_URL:-}
      - TRACEARR_API_KEY=${TRACEARR_API_KEY:-}
      - TRACEARR_USERNAME_ALIASES=${TRACEARR_USERNAME_ALIASES:-}
      - STATS_CACHE_DIR=/app/cache
      - CACHE_WARMUP_ENABLED=${CACHE_WARMUP_ENABLED:-true}
      - CACHE_WARMUP_CONCURRENCY=${CACHE_WARMUP_CONCURRENCY:-1}
      - CACHE_WARMUP_DELAY_MS=${CACHE_WARMUP_DELAY_MS:-1000}
      - CACHE_REFRESH_INTERVAL_MINUTES=${CACHE_REFRESH_INTERVAL_MINUTES:-15}
    volumes:
      # Mount custom music files (optional)
      - ./music:/app/static/music:ro
      # Persistent per-user stats cache. Without this, the cache lives on
      # the container's writable tmpfs and is lost on every restart, so a
      # full re-warm (all users x all completed periods) runs again each
      # time the container comes up.
      - stats-cache:/app/cache
    restart: unless-stopped
    # Security: Read-only root filesystem
    read_only: true
    # Security: Drop all capabilities
    cap_drop:
      - ALL
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
    # Tmpfs for writable directories needed by Node
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3003/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  # Named volume backing /app/cache. Swap this for a bind mount
  # (e.g. "./cache:/app/cache") if you'd rather have the cache files
  # directly on the host.
  stats-cache:
